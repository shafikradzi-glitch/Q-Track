<style>
/* Q-TRACK design system: neutral slate canvas, one navy brand, status colours reserved for meaning. */
:root {
  color-scheme: light;
  --bg: #F5F7FB;
  --surface: #FFFFFF;
  --surface-2: #F8FAFD;
  --sunk: #EEF2F8;
  --border: #E2E7F0;
  --border-strong: #CBD3E1;
  --text: #0F172A;
  --text-2: #334155;
  --muted: #5B6880;
  --brand: #0B2A6F;
  --brand-ink: #FFFFFF;
  --side: #0A1F4F;
  --side-2: #12306E;
  --side-text: #C9D4EE;
  --side-muted: #8C9CC4;
  --accent: #2563EB;
  --accent-soft: #E7EEFE;
  --focus: #2563EB;
  --good: #15803D; --good-bg: #DCFCE7; --good-ink: #14532D; --good-solid: #16A34A;
  --warn: #B45309; --warn-bg: #FEF3C7; --warn-ink: #78350F; --warn-solid: #D97706;
  --bad: #B91C1C;  --bad-bg: #FEE2E2;  --bad-ink: #7F1D1D;  --bad-solid: #DC2626;
  --grey: #475569; --grey-bg: #E2E8F0; --grey-ink: #1E293B; --grey-solid: #94A3B8;
  --info-bg: #E0ECFF; --info-ink: #1E3A8A;
  --chart-grid: #E5E9F2;
  --chart-ref: #64748B;
  --s1: #2563EB; --s2: #0EA5A4; --s3: #7C3AED; --s4: #F59E0B;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 1px 1px rgba(15, 23, 42, .03);
  --shadow-lg: 0 12px 40px rgba(15, 23, 42, .18);
  --radius: 14px;
  --radius-sm: 9px;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B1020; --surface: #121A2E; --surface-2: #0F1728; --sunk: #0C1322; --border: #1F2A44; --border-strong: #2C3B5E;
    --text: #E6EAF2; --text-2: #C3CCDD; --muted: #93A0B9;
    --brand: #8FB0FF; --brand-ink: #0B1020; --side: #070C19; --side-2: #121C35; --side-text: #C9D4EE; --side-muted: #7F8FB5;
    --accent: #60A5FA; --accent-soft: #15254A; --focus: #93C5FD;
    --good: #4ADE80; --good-bg: #0F2E1D; --good-ink: #BBF7D0; --good-solid: #22C55E;
    --warn: #FBBF24; --warn-bg: #33250A; --warn-ink: #FDE68A; --warn-solid: #F59E0B;
    --bad: #F87171;  --bad-bg: #3A1414;  --bad-ink: #FECACA;  --bad-solid: #EF4444;
    --grey: #A3AFC4; --grey-bg: #222C40; --grey-ink: #D6DDE8; --grey-solid: #64748B;
    --info-bg: #142449; --info-ink: #BFD4FF;
    --chart-grid: #1F2A44; --chart-ref: #93A0B9;
    --shadow: 0 0 0 1px rgba(255,255,255,.02); --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B1020; --surface: #121A2E; --surface-2: #0F1728; --sunk: #0C1322; --border: #1F2A44; --border-strong: #2C3B5E;
  --text: #E6EAF2; --text-2: #C3CCDD; --muted: #93A0B9;
  --brand: #8FB0FF; --brand-ink: #0B1020; --side: #070C19; --side-2: #121C35; --side-text: #C9D4EE; --side-muted: #7F8FB5;
  --accent: #60A5FA; --accent-soft: #15254A; --focus: #93C5FD;
  --good: #4ADE80; --good-bg: #0F2E1D; --good-ink: #BBF7D0; --good-solid: #22C55E;
  --warn: #FBBF24; --warn-bg: #33250A; --warn-ink: #FDE68A; --warn-solid: #F59E0B;
  --bad: #F87171;  --bad-bg: #3A1414;  --bad-ink: #FECACA;  --bad-solid: #EF4444;
  --grey: #A3AFC4; --grey-bg: #222C40; --grey-ink: #D6DDE8; --grey-solid: #64748B;
  --info-bg: #142449; --info-ink: #BFD4FF;
  --chart-grid: #1F2A44; --chart-ref: #93A0B9;
  --shadow: 0 0 0 1px rgba(255,255,255,.02); --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { margin: 0; letter-spacing: -.01em; }
h1 { font-size: 22px; font-weight: 650; }
h2 { font-size: 15px; font-weight: 620; }
h3 { font-size: 13.5px; font-weight: 620; }
p { margin: 0; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.xs { font-size: 11.5px; }
.mono { font-family: var(--mono); font-size: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); color: var(--side-text); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; z-index: 40; }
.brand { display: flex; align-items: center; gap: 12px; padding: 20px 18px 16px; }
.mark { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(145deg, #3B6CF6, #1E40AF); color: #fff; display: grid; place-items: center; font-weight: 750; font-size: 14px; letter-spacing: .02em; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.brand b { display: block; color: #fff; font-size: 15.5px; letter-spacing: .06em; }
.brand span { display: block; font-size: 10.5px; color: var(--side-muted); line-height: 1.3; }
.nav { padding: 6px 10px 18px; display: flex; flex-direction: column; gap: 1px; }
.nav .grp { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--side-muted); padding: 16px 10px 6px; font-weight: 600; }
.nav button { all: unset; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--side-text); font-size: 13.5px; }
.nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav button[aria-current="page"] { background: var(--side-2); color: #fff; box-shadow: inset 3px 0 0 #60A5FA; }
.nav button:focus-visible { outline: 2px solid #93C5FD; outline-offset: -2px; }
.nav svg { width: 17px; height: 17px; flex: none; opacity: .9; }
.nav .badge { margin-left: auto; background: rgba(255,255,255,.12); color: #fff; font-size: 11px; padding: 0 7px; border-radius: 99px; line-height: 18px; }
.nav .badge.crit { background: #DC2626; }
.side-foot { margin-top: auto; padding: 14px 18px 18px; font-size: 11px; color: var(--side-muted); border-top: 1px solid rgba(255,255,255,.07); }
.main { min-width: 0; display: flex; flex-direction: column; }
body::before { content: ''; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 10px 28px; min-height: 60px; }
.top .crumbs { display: flex; flex-direction: column; min-width: 0; }
.top .crumbs small { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .crumbs b { font-size: 15px; font-weight: 640; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .sp { flex: 1; }
.who { display: flex; align-items: center; gap: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 650; font-size: 12.5px; flex: none; }
.who .meta { line-height: 1.2; }
.who .meta b { display: block; font-size: 13px; }
.who .meta span { font-size: 11.5px; color: var(--muted); }
.menu-btn { display: none; }
.content { padding: 24px 28px 64px; max-width: 1480px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.scrim { display: none; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; }
.banner svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.banner.info { background: var(--info-bg); color: var(--info-ink); }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
.banner.sample { background: repeating-linear-gradient(-45deg, var(--warn-bg), var(--warn-bg) 10px, color-mix(in srgb, var(--warn-bg) 70%, var(--surface)) 10px, color-mix(in srgb, var(--warn-bg) 70%, var(--surface)) 20px); color: var(--warn-ink); font-weight: 520; }

/* ---------- page header ---------- */
.ph { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; }
.ph .t { display: flex; flex-direction: column; gap: 4px; max-width: 820px; }
.ph .t p { color: var(--muted); }
.ph .acts { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-weight: 560; font-size: 13px; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow); }
.btn:hover { border-color: var(--muted); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
:root[data-theme="dark"] .btn.primary { color: #08122A; }
.btn.good { background: var(--good-solid); border-color: var(--good-solid); color: #fff; }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; }
.btn.ghost:hover { background: var(--sunk); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn.icon { width: 36px; padding: 0; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.input, select.input, textarea.input { width: 100%; min-height: 38px; padding: 8px 11px; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--surface); color: var(--text); }
textarea.input { min-height: 84px; resize: vertical; line-height: 1.45; }
.input:focus { outline: 2px solid color-mix(in srgb, var(--focus) 40%, transparent); border-color: var(--focus); }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
.search .input { padding-left: 32px; min-width: 220px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .sp { flex: 1; }
.pills { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 3px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface); }
.pills button { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 560; color: var(--muted); }
.pills button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.pills button:focus-visible { outline: 2px solid var(--focus); }
.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }

/* ---------- cards ---------- */
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-auto { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.span2 { grid-column: span 2; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card > .ch { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 14px; padding: 16px 18px 0; }
.card > .ch .tt { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.card > .ch .tt p { color: var(--muted); font-size: 12.5px; }
.card > .cb { padding: 14px 18px 18px; }
.card > .cf { padding: 10px 18px 14px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11.5px; }
.card.flat { box-shadow: none; }
.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.kpi-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 4px 8px; }
.kpi .lbl { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.kpi .val { font-size: 30px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 12.5px; color: var(--muted); }
.kpi.click { cursor: pointer; }
.kpi.click:hover { border-color: var(--border-strong); }
.method { font-size: 11.5px; color: var(--muted); }
.method b { font-weight: 600; color: var(--text-2); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.l2 { background: var(--info-bg); color: var(--info-ink); }
.tag.prop { background: var(--warn-bg); color: var(--warn-ink); }

/* ---------- status chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--sunk); color: var(--text-2); }
.chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .85; }
.chip.plain::before { display: none; }
.chip.lg { height: 30px; padding: 0 13px; font-size: 13.5px; }
.st-Green, .st-good { background: var(--good-bg); color: var(--good-ink); }
.st-Amber, .st-watch { background: var(--warn-bg); color: var(--warn-ink); }
.st-Red, .st-action { background: var(--bad-bg); color: var(--bad-ink); }
.st-Grey { background: var(--grey-bg); color: var(--grey-ink); }
.st-NA, .st-Not { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--border-strong); }
.sev-Critical { background: var(--bad-solid); color: #fff; }
.sev-High { background: var(--bad-bg); color: var(--bad-ink); }
.sev-Medium { background: var(--warn-bg); color: var(--warn-ink); }
.sev-Low, .sev-Observation, .sev-Minor { background: var(--sunk); color: var(--text-2); }
.sev-Major { background: var(--bad-bg); color: var(--bad-ink); }
.lvl { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; font-weight: 700; font-size: 12px; background: var(--sunk); color: var(--text); flex: none; }
.lvl.C { background: var(--bad-solid); color: #fff; }
.lvl.B { background: var(--warn-solid); color: #fff; }

/* ---------- heat-map ---------- */
.heat { width: 100%; border-collapse: separate; border-spacing: 3px; font-size: 12.5px; }
.heat th { font-weight: 600; color: var(--muted); font-size: 11px; text-align: center; padding: 4px 2px 8px; vertical-align: bottom; line-height: 1.2; }
.heat th.l, .heat td.l { text-align: left; }
.heat td { padding: 0; }
.heat td.l { padding: 6px 10px 6px 0; min-width: 210px; }
.heat td.l b { display: block; font-weight: 620; }
.heat td.l span { font-size: 11.5px; color: var(--muted); }
.cell { display: grid; place-items: center; height: 34px; min-width: 38px; border-radius: 7px; font-weight: 700; font-size: 12px; cursor: default; }
button.cell { border: 0; width: 100%; cursor: pointer; }
.cell.Green { background: var(--good-bg); color: var(--good-ink); }
.cell.Amber { background: var(--warn-bg); color: var(--warn-ink); }
.cell.Red { background: var(--bad-solid); color: #fff; }
.cell.Grey { background: repeating-linear-gradient(135deg, var(--grey-bg), var(--grey-bg) 4px, color-mix(in srgb, var(--grey-bg) 55%, var(--surface)) 4px, color-mix(in srgb, var(--grey-bg) 55%, var(--surface)) 8px); color: var(--grey-ink); }
.cell.NA, .cell.none { background: var(--surface-2); color: var(--muted); box-shadow: inset 0 0 0 1px var(--border); font-weight: 500; }
.cell.ov { min-width: 86px; font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -3px; margin-right: 6px; }
.chg { font-size: 11px; font-weight: 650; }
.chg.worse { color: var(--bad); }
.chg.better { color: var(--good); }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 600; font-size: 11.5px; letter-spacing: .03em; color: var(--muted); padding: 11px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
.tbl th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.tbl th button:focus-visible { outline: 2px solid var(--focus); }
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover td { background: var(--surface-2); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .clip { max-width: 420px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tbl.compact td, .tbl.compact th { padding: 8px 12px; }
.inner-tbl { border: 0; box-shadow: none; border-radius: 0; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; }
.li { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); align-items: flex-start; }
.li:first-child { border-top: 0; padding-top: 2px; }
.li .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.li .body b { font-weight: 600; }
.li .side-r { text-align: right; flex: none; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.tags { display: inline-flex; flex-wrap: wrap; gap: 6px; }
button.li { all: unset; display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); align-items: flex-start; cursor: pointer; }
button.li:hover b { text-decoration: underline; }
button.li:focus-visible { outline: 2px solid var(--focus); }

/* ---------- programme cards ---------- */
.prog { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; text-align: left; border: 1px solid var(--border); }
.prog:hover { border-color: var(--border-strong); }
.prog .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.prog .hd b { font-size: 15px; }
.prog .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.prog .stats div { background: var(--surface-2); border-radius: 9px; padding: 8px 10px; }
.prog .stats b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.prog .stats span { font-size: 11px; color: var(--muted); }
.prog .issue { font-size: 12.5px; color: var(--text-2); border-left: 3px solid var(--bad-solid); padding-left: 10px; }
.prog .issue.none { border-color: var(--good-solid); color: var(--muted); }
.hero { display: grid; grid-template-columns: 1.15fr 2fr; gap: 16px; }
.hero-main { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; justify-content: space-between; background: linear-gradient(135deg, var(--brand), #1E40AF); color: #fff; border: 0; }
:root[data-theme="dark"] .hero-main { background: linear-gradient(135deg, #10224F, #1B3A8A); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero-main { background: linear-gradient(135deg, #10224F, #1B3A8A); } }
.hero-main .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; opacity: .75; font-weight: 600; }
.hero-main .big { font-size: 40px; font-weight: 700; letter-spacing: -.02em; line-height: 1; display: flex; align-items: center; gap: 12px; }
.hero-main .dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 0 4px rgba(255,255,255,.18); }
.hero-main p { opacity: .85; font-size: 13px; }
.dist { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.15); }
.dist span { display: block; height: 100%; }
.counts { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; }
.counts b { font-size: 18px; margin-right: 4px; font-variant-numeric: tabular-nums; }

/* ---------- charts ---------- */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
