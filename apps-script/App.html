      h('div', { class: 'crumbs' }, h('small', { id: 'crumb-sub' }), h('b', { id: 'crumb' })),

  function drawNav() {
    const nav = $('#nav');

    nav.replaceChildren();

  function tipFor(box) { let t = box.querySelector(':scope > .tip'); if (!t) { t = h('div', { class: 'tip', hidden: true }); box.appendChild(t); } return t; }
  function showTip(box, ev, lines) {
    const t = tipFor(box);
    t.replaceChildren(...lines.map((l, i) => (i === 0 ? h('b', null, l) : h('div', null, l))));
    t.hidden = false;
    const r = box.getBoundingClientRect();
    let x = ev.clientX - r.left + 12, y = ev.clientY - r.top + 12;
    if (x + t.offsetWidth > r.width) x = Math.max(0, ev.clientX - r.left - t.offsetWidth - 12);
    if (y + t.offsetHeight > r.height + 40) y = Math.max(0, ev.clientY - r.top - t.offsetHeight - 12);
    t.style.left = x + 'px'; t.style.top = y + 'px';
  }
  function hideTip(box) { const t = box.querySelector(':scope > .tip'); if (t) t.hidden = true; }
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  /** Horizontal bars with labels and values. rows: {label, value, color?, tip?} */
  function hbars(rows, opts) {
    opts = opts || {};
    const box = h('div', { class: 'chart' });
    requestAnimationFrame(() => {
      const W = Math.max(260, box.clientWidth || 480), rowH = 24, gap = 8;
      const H = rows.length * (rowH + gap) + 4;
      const svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', role: 'img', 'aria-label': opts.aria || '' });
      const lw = Math.min(W * 0.42, 190), vw = 46;
      const max = Math.max(1, opts.max || Math.max.apply(null, rows.map((r) => r.value)));
      let cum = 0;
      const total = rows.reduce((a, r) => a + r.value, 0);
      rows.forEach((r, i) => {
        const y = i * (rowH + gap);
        const label = String(r.label);
        svg.appendChild(s('text', { x: lw - 10, y: y + rowH / 2 + 4, 'text-anchor': 'end', class: 'lbl' }, label.length > 28 ? label.slice(0, 27) + '…' : label));
        svg.appendChild(s('rect', { x: lw, y: y, width: W - lw - vw, height: rowH, rx: 5, fill: css('--sunk') }));
        const bw = Math.max(2, (W - lw - vw) * (r.value / max));
        const bar = s('rect', { x: lw, y: y, width: bw, height: rowH, rx: 5, fill: r.color || css('--s1') });
        svg.appendChild(bar);
        svg.appendChild(s('text', { x: lw + bw + 6, y: y + rowH / 2 + 4, class: 'val' }, F.int(r.value)));
        cum += r.value;
        const c = cum;
        bar.addEventListener('mousemove', (ev) => showTip(box, ev, [label, F.int(r.value) + (total ? ' · ' + F.pct(r.value / total) + ' of total · cumulative ' + F.pct(c / total) : '')].concat(r.tip ? [r.tip] : [])));
        bar.addEventListener('mouseleave', () => hideTip(box));
      });
      box.prepend(svg);
    });
    return box;
  }

  /** NCR/OBS raised per month with c-chart limits. */
  function cchart(monthly) {
    const box = h('div', { class: 'chart' });
    requestAnimationFrame(() => {
      const W = Math.max(300, box.clientWidth || 600), H = 200, m = { l: 30, r: 52, t: 12, b: 26 };

      const x = (i) => m.l + (i + 0.5) * ((W - m.l - m.r) / n), bw = Math.max(6, ((W - m.l - m.r) / n) * 0.62);
      const y = (v) => H - m.b - (v / max) * (H - m.t - m.b);
      const svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', role: 'img', 'aria-label': 'NCR and OBS raised per month with control limits' });
      [0, Math.round(max / 2), Math.round(max)].forEach((t) => {
        svg.appendChild(s('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: css('--chart-grid') }));
        svg.appendChild(s('text', { x: m.l - 6, y: y(t) + 4, 'text-anchor': 'end' }, String(t)));
      });

      box.prepend(svg);

  /** Baseline (hollow) vs forecast/actual (filled) per milestone on a time axis. */
  function dumbbell(ms) {
    const box = h('div', { class: 'chart' });
    if (!ms.length) return empty('No critical milestones recorded.', 'milestone');
    requestAnimationFrame(() => {
      const W = Math.max(320, box.clientWidth || 640), rowH = 30, lw = Math.min(W * 0.4, 270), m = { t: 26, r: 24 };
      const asOf = B().asOf;
      const pts = [];
      ms.forEach((x) => [x.baseline, x.forecast, x.actual].forEach((d) => { if (d) pts.push(dayNum(d)); }));
      pts.push(dayNum(asOf));
      let lo = Math.min.apply(null, pts) - 7, hi = Math.max.apply(null, pts) + 7;
      const H = m.t + ms.length * rowH + 6;
      const X = (d) => lw + ((dayNum(d) - lo) / (hi - lo || 1)) * (W - lw - m.r);
      const svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', role: 'img', 'aria-label': 'Critical milestones: baseline against forecast' });
      const ticks = 5;
      for (let i = 0; i <= ticks; i++) {
        const d = new Date((lo + ((hi - lo) * i) / ticks) * 864e5).toISOString().slice(0, 10);
        svg.appendChild(s('line', { x1: X(d), x2: X(d), y1: m.t - 6, y2: H, stroke: css('--chart-grid') }));
        svg.appendChild(s('text', { x: X(d), y: 12, 'text-anchor': 'middle' }, F.short(d)));
      }
      svg.appendChild(s('line', { x1: X(asOf), x2: X(asOf), y1: m.t - 8, y2: H, stroke: css('--accent'), 'stroke-width': 1.5, 'stroke-dasharray': '3 3' }));
      svg.appendChild(s('text', { x: X(asOf) + 4, y: m.t - 10, fill: css('--accent') }, 'today'));
      ms.forEach((x, i) => {
        const y = m.t + i * rowH + rowH / 2;
        const lab = projLabel(x.projectId) + ' · ' + x.item;
        svg.appendChild(s('text', { x: lw - 10, y: y + 4, 'text-anchor': 'end', class: 'lbl' }, lab.length > 38 ? lab.slice(0, 37) + '…' : lab));
        const end = x.actual || x.forecast;
        const late = x.status === 'Late' || x.status === 'Past baseline' || x.status === 'Past forecast';
        const col = x.status === 'Achieved' ? css('--good-solid') : late ? css('--bad-solid') : css('--s1');
        if (x.baseline && end) svg.appendChild(s('line', { x1: X(x.baseline), x2: X(end), y1: y, y2: y, stroke: col, 'stroke-width': 3, opacity: 0.45, 'stroke-linecap': 'round' }));
        if (x.baseline) svg.appendChild(s('circle', { cx: X(x.baseline), cy: y, r: 5, fill: css('--surface'), stroke: css('--chart-ref'), 'stroke-width': 2 }));
        const dot = end ? s('circle', { cx: X(end), cy: y, r: 6, fill: col }) : null;
        if (dot) svg.appendChild(dot);
        const hit = s('rect', { x: lw, y: y - rowH / 2, width: W - lw, height: rowH, fill: 'transparent' });
        hit.addEventListener('mousemove', (ev) => showTip(box, ev, [lab, 'Baseline ' + F.date(x.baseline) + ' · ' + (x.actual ? 'actual ' + F.date(x.actual) : 'forecast ' + F.date(x.forecast)), x.status + (x.variance ? ' · ' + (x.variance > 0 ? '+' : '') + x.variance + ' days' : '')]));
        hit.addEventListener('mouseleave', () => hideTip(box));
        hit.addEventListener('click', () => openRecord('Milestones', D('Milestones').find((r) => r.id === x.id)));
        hit.style.cursor = 'pointer';
        svg.appendChild(hit);
      });
      box.prepend(svg);
    });
    return box;
  }
